name: Gantt data contract
on:
  push:
    branches: [main]
    paths:
      - "erp-project.json"
      - "Gonchar.html"
      - "scripts/gantt.mjs"
      - "scripts/check-gantt-dashboard.mjs"
      - ".github/workflows/gantt-contract.yml"
  pull_request:
    paths:
      - "erp-project.json"
      - "Gonchar.html"
      - "scripts/gantt.mjs"
      - "scripts/check-gantt-dashboard.mjs"
      - ".github/workflows/gantt-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-gantt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Gantt JSON contract
        run: node scripts/gantt.mjs --check
      - name: Check dashboard JavaScript syntax
        run: node scripts/check-gantt-dashboard.mjs
