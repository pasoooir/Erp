name: Gantt data contract
on:
  push:
    branches: [main]
    paths:
      - "erp-project.json"
      - "Gonchar.html"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/gantt-contract.yml"
  pull_request:
    paths:
      - "erp-project.json"
      - "Gonchar.html"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/gantt-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-gantt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Gantt JSON contract
        run: node scripts/gantt.mjs --check
      - name: Test Gantt validator positive and negative cases
        run: node --test tests/gantt.test.mjs
      - name: Test summary sync on a temporary copy of the canonical plan
        run: |
          cp erp-project.json /tmp/erp-project-sync-test.json
          node scripts/gantt.mjs --sync-summary --file /tmp/erp-project-sync-test.json
          node scripts/gantt.mjs --check --file /tmp/erp-project-sync-test.json
      - name: Check dashboard JavaScript syntax
        run: node scripts/check-gantt-dashboard.mjs
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test dashboard interactions in Chromium
        run: node --test tests/dashboard-browser.test.mjs
