name: ERP live API smoke test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/erp-api-smoke.yml"
      - "index.html"
      - "public/index.html"
      - "public/modules/erp-shell/erp-shell.js"
  pull_request:
    paths:
      - ".github/workflows/erp-api-smoke.yml"
      - "src/**"
      - "wrangler.toml"
      - "public/modules/erp-shell/erp-shell.js"
      - "docs/ERP_API_DEPLOYMENT.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the published GitHub Pages entrypoint uses the deployed API
        env:
          PAGES_BASE: https://pasoooir.github.io/Erp/
        run: |
          set -euo pipefail
          page="$(curl --fail-with-body --silent --show-error "$PAGES_BASE")"
          src="$(printf '%s' "$page" | grep -oE 'src="[^"]*erp-shell[.]js"' | head -n 1 | cut -d '"' -f 2)"
          test -n "$src"
          asset_url="$(node -e 'console.log(new URL(process.argv[1], process.argv[2]).href)' "$src" "$PAGES_BASE")"
          curl --fail-with-body --silent --show-error "$asset_url" -o /tmp/erp-shell.js
          grep -q 'erp-api.pasoooir-erp.workers.dev' /tmp/erp-shell.js
          echo "Published Pages HTML and ERP shell asset point to the deployed API."
      - name: Check deployed health endpoint
        env:
          API_BASE: https://erp-api.pasoooir-erp.workers.dev
        run: |
          set -euo pipefail
          health="$(curl --fail-with-body --silent --show-error "$API_BASE/api/health")"
          printf '%s' "$health" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const p=JSON.parse(s);
              if(p?.data?.status!=="ok" || p?.data?.database!=="connected") {
                console.error("Unexpected health payload:",p); process.exit(1);
              }
              console.log("Live API health and D1 connectivity passed.");
            });
          '
      - name: Check bootstrap status endpoint without changing data
        env:
          API_BASE: https://erp-api.pasoooir-erp.workers.dev
        run: |
          set -euo pipefail
          status="$(curl --fail-with-body --silent --show-error "$API_BASE/api/v1/auth/status")"
          printf '%s' "$status" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const p=JSON.parse(s);
              if(typeof p?.data?.bootstrap_required!=="boolean") {
                console.error("Unexpected auth status payload:",p); process.exit(1);
              }
              console.log("Bootstrap status endpoint passed.");
            });
          '
      - name: Verify CORS rejects untrusted origins
        env:
          API_BASE: https://erp-api.pasoooir-erp.workers.dev
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/denied.json --write-out '%{http_code}' -H 'Origin: https://attacker.example' "$API_BASE/api/v1/auth/status")"
          test "$code" = "403"
          echo "Untrusted Origin is denied."
      - name: Verify bootstrap preflight permits the secret header
        env:
          API_BASE: https://erp-api.pasoooir-erp.workers.dev
        run: |
          set -euo pipefail
          code="$(curl --silent --output /dev/null --dump-header /tmp/bootstrap-preflight.headers --write-out '%{http_code}' -X OPTIONS \
            -H 'Origin: https://pasoooir.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,x-bootstrap-secret' \
            "$API_BASE/api/v1/auth/bootstrap")"
          test "$code" = "204"
          grep -qi '^access-control-allow-origin: https://pasoooir.github.io' /tmp/bootstrap-preflight.headers
          grep -qi '^access-control-allow-credentials: true' /tmp/bootstrap-preflight.headers
          grep -qi '^access-control-allow-headers:.*x-bootstrap-secret' /tmp/bootstrap-preflight.headers
          echo "Bootstrap preflight permits the custom secret header."
      - name: Verify bootstrap POST reaches API and returns readable CORS error
        env:
          API_BASE: https://erp-api.pasoooir-erp.workers.dev
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/bootstrap-denied.json --dump-header /tmp/bootstrap-denied.headers --write-out '%{http_code}' \
            -X POST "$API_BASE/api/v1/auth/bootstrap" \
            -H 'Origin: https://pasoooir.github.io' \
            -H 'Content-Type: application/json' \
            -H 'X-Bootstrap-Secret: intentionally-invalid-smoke-test-secret' \
            --data '{}')"
          test "$code" = "403"
          grep -qi '^access-control-allow-origin: https://pasoooir.github.io' /tmp/bootstrap-denied.headers
          grep -q '"code":"bootstrap_denied"' /tmp/bootstrap-denied.json
          echo "Bootstrap POST reaches API; invalid secret is rejected with readable CORS response and no database mutation."
      - name: Verify credentialed CORS preflight for GitHub Pages
        env:
          API_BASE: https://erp-api.pasoooir-erp.workers.dev
        run: |
          set -euo pipefail
          code="$(curl --silent --output /dev/null --dump-header /tmp/preflight.headers --write-out '%{http_code}' -X OPTIONS \
            -H 'Origin: https://pasoooir.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$API_BASE/api/v1/auth/status")"
          test "$code" = "204"
          grep -qi '^access-control-allow-origin: https://pasoooir.github.io' /tmp/preflight.headers
          grep -qi '^access-control-allow-credentials: true' /tmp/preflight.headers
          echo "GitHub Pages credentialed CORS preflight passed."
      - name: Verify isolated Cloudflare preview health and D1 connectivity
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/cloudflare-preview-smoke-and-tracker'
        env:
          PREVIEW_API: https://fix-cloudflare-preview-safe-d1-config-erp-api.pasoooir-erp.workers.dev
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error "$PREVIEW_API/api/health")"
          printf '%s' "$response" | node -e '
            let body="";
            process.stdin.on("data",chunk=>body+=chunk).on("end",()=>{
              const payload=JSON.parse(body);
              if(payload?.data?.status!=="ok" || payload?.data?.database!=="connected") {
                console.error("Preview Worker/D1 health check failed:",payload);
                process.exit(1);
              }
              console.log("Isolated preview Worker and D1 connectivity passed.");
            });
          '
      - name: Verify preview CORS allow/deny behavior
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/cloudflare-preview-smoke-and-tracker'
        env:
          PREVIEW_API: https://fix-cloudflare-preview-safe-d1-config-erp-api.pasoooir-erp.workers.dev
        run: |
          set -euo pipefail
          allowed="$(curl --silent --output /dev/null --write-out '%{http_code}' -X OPTIONS \
            -H 'Origin: https://pasoooir.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$PREVIEW_API/api/health")"
          test "$allowed" = "204"
          denied="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Origin: https://attacker.example' "$PREVIEW_API/api/health")"
          test "$denied" = "403"
          echo "Preview CORS allow/deny checks passed."
