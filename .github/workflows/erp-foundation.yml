name: ERP foundation checks
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "tests/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/erp-foundation.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "tests/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/erp-foundation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-erp-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run Worker and D1 schema unit tests
        run: npm test
      - name: Install Wrangler for local runtime integration
        run: npm install --no-save --package-lock=false wrangler playwright
      - name: Install Chromium for UI integration
        run: npx playwright install --with-deps chromium
      - name: Apply D1 migration to local SQLite
        run: CI=true npx wrangler d1 migrations apply erp-production-eu --local
      - name: Exercise Worker on local Cloudflare runtime
        env:
          BOOTSTRAP_SECRET: ci-only-bootstrap-secret-for-local-runtime
          WEBAUTHN_RP_ID: localhost
          WEBAUTHN_ORIGIN: http://localhost:8787
        run: |
          cat > .dev.vars <<EOF
          BOOTSTRAP_SECRET=$BOOTSTRAP_SECRET
          WEBAUTHN_RP_ID=$WEBAUTHN_RP_ID
          WEBAUTHN_ORIGIN=$WEBAUTHN_ORIGIN
          EOF
          node tests/worker-runtime-smoke.mjs
