name: ERP Cloudflare preview smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - "wrangler.toml"
      - ".github/workflows/erp-preview-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/cloudflare-preview-safe-d1-config' || github.event.pull_request.head.ref == 'test/cloudflare-preview-smoke-and-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify isolated Cloudflare Worker preview health and D1 connectivity
        env:
          PREVIEW_API: https://fix-cloudflare-preview-safe-d1-config-erp-api.pasoooir-erp.workers.dev
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error "$PREVIEW_API/api/health")"
          printf '%s' "$response" | node -e '
            let body="";
            process.stdin.on("data",chunk=>body+=chunk).on("end",()=>{
              const payload=JSON.parse(body);
              if(payload?.data?.status!=="ok" || payload?.data?.database!=="connected") {
                console.error("Preview Worker/D1 health check failed:",payload);
                process.exit(1);
              }
              console.log("Isolated preview Worker and D1 connectivity passed.");
            });
          '
      - name: Verify preview CORS accepts only the GitHub Pages origin
        env:
          PREVIEW_API: https://fix-cloudflare-preview-safe-d1-config-erp-api.pasoooir-erp.workers.dev
        run: |
          set -euo pipefail
          allowed="$(curl --silent --output /dev/null --write-out '%{http_code}' -X OPTIONS \
            -H 'Origin: https://pasoooir.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$PREVIEW_API/api/health")"
          test "$allowed" = "204"
          denied="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Origin: https://attacker.example' "$PREVIEW_API/api/health")"
          test "$denied" = "403"
          echo "Preview CORS allow/deny checks passed."
