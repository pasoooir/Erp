name: Deploy ERP frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ERP
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify published entry points
        run: |
          test -s public/index.html
          test -s public/bootstrap-admin.html
          test -s public/bootstrap-admin/index.html
          test -f public/.nojekyll
      - name: Upload ERP frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy ERP frontend
        id: deployment
        uses: actions/deploy-pages@v4
