name = "erp-api"
main = "src/index.js"
compatibility_date = "2026-10-28"
workers_dev = true

[vars]
APP_ORIGIN = "https://pasoooir.github.io"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "erp-production-eu"
database_id = "d33370d3-5bb9-4439-be1e-39467b903482"
migrations_dir = "migrations"
