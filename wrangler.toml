name = "erp-api"
main = "workers.js"
compatibility_date = "2026-10-28"
workers_dev = true

# The frontend is hosted independently by GitHub Pages.
# This Worker serves API routes only; it does not use Pages or Workers Assets.
[vars]
APP_ORIGIN = "https://pasoooir.github.io"

[[d1_databases]]
binding = "DB"
database_name = "erp-production-eu"
database_id = "d33370d3-5bb9-4439-be1e-39467b903482"
migrations_dir = "migrations"

# Cloudflare Workers Builds preview only: bind the isolated, empty preview DB.
# Never point preview builds at erp-production-eu. No remote migrations are run here.
[previews.vars]
APP_ORIGIN = "https://pasoooir.github.io"

[[previews.d1_databases]]
binding = "DB"
database_name = "erp-preview-passkey-e2e"
database_id = "b108b011-6b3c-49cf-a7c2-7cae0b8b0416"
